<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<title>join</title>
<script th:src="@{/js/jquery-3.6.0.js}"></script>
<script type="text/javascript">
$(document).ready(function() {
	//이메일 select 함수
	$('#select').change(function() {
		if ($('#select').val() == 'directly') {
			$('#textEmail').attr("disabled", false);
			$('#textEmail').val("");
			$('#textEmail').focus();
		} else {
			$('#textEmail').val($('#select').val());
		}
	});
})

//비밀번호1의 구성 체크
function checkPw1(){
   var pw1 = document.getElementById('userpw');
   var pwcheck = /^(?=.*[a-zA-Z])(?=.*[!@#$%^*+=-])(?=.*[0-9]).{8,25}$/;
   
   //공백일 때
   if (pw1.value == "" || pw1.value.length == 0) {
      document.getElementById('pwEssential').style.display = "inline-block"; //필수 입력 항목
      document.getElementById('pwCondition').style.display = "none";
      document.getElementById('pwCanUse').style.display = "none";
      return false;
   }
   //공백 아닐 때
   else {
	  //조건에 맞지 않을 때
      if (!(pwcheck.test(pw1.value)) || (pw1.value.length < 6 || pw1.value.length > 12)) {
         document.getElementById('pwEssential').style.display = "none";
         document.getElementById('pwCanUse').style.display = "none";
         document.getElementById('pwCondition').style.display = "inline-block"; //6~12자리
         pw1.focus();
         return false;
      } 
      else if(pwcheck.test(pw1.value) && (pw1.value.length >= 6 && pw1.value.length <= 12)){
         document.getElementById('pwEssential').style.display = "none";            
         document.getElementById('pwCondition').style.display = "none";            
         document.getElementById('pwCanUse').style.display = "inline-block"; //사용 가능한 비밀번호            
      }
   }
   return true;
}

//비밀번호1과 비밀번호2가 일치한지 체크
function checkPw2() {
   let pw1 = document.getElementById('userpw');
   let pw2 = document.getElementById('userpw2');
   
   //pw1이 공백이 아닐 때
   if(pw1.value != "" || pw1.value.length != 0) {
	   //pw2가 공백일 때
	   if(pw2.value == "" || pw2.value.length == 0) {
		   document.getElementById('pwEssential2').style.display = "inline-block"; //필수 입력 항목
		   document.getElementById('pwSame').style.display = "none";
		   document.getElementById('pwConcurrence').style.display = "none";
		   document.getElementById('pwInputPw1').style.display = "none";
	   }
	   else if (pw1.value != "" && pw2.value != "") {
	   		if(pw1.value == pw2.value) {
		    	document.getElementById('pwEssential2').style.display = "none";
		        document.getElementById('pwSame').style.display = "none";         
		    	document.getElementById('pwConcurrence').style.display = "inline-block"; //비밀번호 일치
		   document.getElementById('pwInputPw1').style.display = "none";
		    }
	   		else {
			    document.getElementById('pwEssential2').style.display = "none";
			    document.getElementById('pwSame').style.display = "inline-block"; // 동일한 비밀번호 입력            
			    document.getElementById('pwConcurrence').style.display = "none";   			
		   document.getElementById('pwInputPw1').style.display = "none";
	   		}
	   }
   	   else {
		   return true;         
	   }
   }
   //pw1이 공백일 때
   else {
	   document.getElementById('pwEssential').style.display = "none";
	   document.getElementById('pwSame').style.display = "none";
	   document.getElementById('pwConcurrence').style.display = "none";
	   document.getElementById('pwInputPw1').style.display = "inline-block"; //비밀번호1 먼저 입력
	   return false;
   }
}

//생년월일 합치기
function plusBirth() {
	let date = $("#birthday").val();
	let today = new Date();

	if(date != "") {		
		let dateArr = date.split('-');
		let year = dateArr[0];
		
		let age = today.getFullYear() - year + 1;
		
		console.log(age);
		
		$('#age').val(age);
	}
}

//이름 체크
function checkName() {
	   let username = document.getElementById('username');
		   
	   if (username.value == "" || username.value.length == 0) {
	      document.getElementById('nameEssential').style.display = "inline-block"; //필수 입력
	      document.getElementById('nameRewrite').style.display = "none";
	      document.getElementById('nameCanUse').style.display = "none";
	      return false;
	   }
	   //공백이 아닐 때
	   else {
	      for(let i=0; i<username.value.length; i++) {
	         var charChk = username.value.substring(i,i+1);
	         if(charChk.match(/[0-9]|[a-z]|[A-Z]/) || username.value.length <= 1) {
	            document.getElementById('nameEssential').style.display = "none";
	            document.getElementById('nameRewrite').style.display = "inline-block"; //정확한 형식으로 입력
	            document.getElementById('nameCanUse').style.display = "none";
	            return false;
	         } else {
		         document.getElementById('nameEssential').style.display = "none";
		         document.getElementById('nameRewrite').style.display = "none";
		         document.getElementById('nameCanUse').style.display = "inline-block"; //사용 가능한 이름
	         }
	      }
	   }
	   return true;
	}
//이메일 주소 합치기 (hidden에 넣기)
function plusEmail() {
	let emailFront = $("#emailId").val();
	let at = $("#at").text();
	let emailEnd = $("#textEmail").val();
	if(emailFront != "" && emailEnd != "") {
		document.getElementById('email').value = emailFront + at + emailEnd;
	}
	return true;
}
//임시 저장
function saved() {
	let tempSave = new Object();
		(function (obj) {
			obj.configuration = {
	      		time: 60 * 3
	    	};
	    	obj.bindTimer = function() {
	      		let join = document.querySelector('#join');
	      		let info = join.value;
	      		let ref3;

	      let encodedInfo = btoa(info);
	      let ref1 = window.localStorage.getItem('info-01');
	      let ref2 = window.localStorage.getItem('info-02');

	      if ((window.localStorage) && (encodedInfo != ref1)){
	        window.localStorage.setItem('info-01', encodedInfo);
	        window.localStorage.setItem('info-02', ref1);
	        window.localStorage.setItem('info-03', ref2);
	      }
	      else if (!window.localStorage) {
	        console.log('Error' + ': Your browser not support')
	        return false;
	      }
	    };

	    obj.start = function() {
	      obj.bindTimer();
	      setTimeout(function() {
	        obj.start();
	      }, obj.configuration.time * 1000);
	    };
	    obj.start();
	  })(tempSave);
};
</script>
</head>

<body>
	<h1>회원 가입</h1>
	<form th:action="@{/member/joinCheck}" method="post" id="join" onsubmit="plusEmail()">

		<!-- 아이디 입력 -->
		<div class="groupForm">
			<label for="userid">아이디</label><input type="text" id="userid" name="userid" maxlength="15">
			<!-- id ajax 중복체크 -->
			<span class="checkIdEssential" style="display: none; color: red;">필수 입력 항목입니다</span>
			<span class="checkIdUsed" style="display: none; color: red;">이미 존재하거나 사용 불가한 아이디입니다</span>
			<span class="checkIdLength" style="display: none; color: red;">숫자,
				영문, 특수문자를 포함한 6~15자리의 아이디를 입력해 주세요</span> 
			<span class="checkIdCanUse" style="display: none; color: green;">사용 가능한 아이디입니다.</span>
		</div>

		<!-- 비밀번호 -->
		<div class="groupForm">
			<label for="userpw">비밀번호</label> <input type="password"
				class="inputForm" id="userpw" name="userpw" oninput="checkPw1()">
			<span class="validFeedback" id="pwEssential"
				style="display: none; color: red;">필수 입력 항목입니다</span> <span
				class="validFeedback" id="pwCondition"
				style="display: none; color: red;">숫자, 영문, 특수문자를 포함한 6~12자리의
				비밀번호를 입력해 주세요</span> <span class="validFeedback" id="pwCanUse"
				style="display: none; color: green;">올바른 형식입니다</span><br>
			<!-- 비밀번호 재확인 -->
			<label for="userpw2">비밀번호 재확인</label> <input type="password"
				class="inputForm" id="userpw2" name="userpw2" oninput="checkPw2()">
			<span class="validFeedback" id="pwEssential2"
				style="display: none; color: red;">필수 입력 항목입니다</span> <span
				class="validFeedback" id="pwSame" style="display: none; color: red;">동일한
				암호를 입력하세요</span> <span class="validFeedback" id="pwConcurrence"
				style="display: none; color: green;">비밀번호가 일치합니다</span> <span
				class="validFeedback" id="pwInputPw1"
				style="display: none; color: red;">비밀번호를 먼저 입력해 주세요</span>
		</div>
		<!-- // 아이디, 비밀번호 입력 -->

		<!-- 이름 입력 -->
		<div class="groupForm">
			<label for="username">성명</label> <input type="text" class="inputForm"
				id="username" name="username" oninput="checkName()"> <span
				class="validFeedback" id="nameEssential"
				style="display: none; color: red;">필수 입력 항목입니다</span> <span
				class="validFeedback" id="nameRewrite"
				style="display: none; color: red;">성명을 정확히 입력해 주세요</span> <span
				class="validFeedback" id="nameCanUse"
				style="display: none; color: green;">올바른 형식입니다</span>
		</div>

		<!-- 생년월일 -->
		<div class="groupForm">
			<input type="date" id="birthday" name="birthday"
				onchange="plusBirth()" required> <input type="text" id="age"
				name="age">
		</div>

		<!-- gender : 맞는지 체크하기 -->
		<div class="groupForm">
			<label for="gender">성별</label> <select id="gender" name="gender"
				class="inputForm" required>
				<option value="" disabled selected>성별</option>
				<option value="남">남</option>
				<option value="여">여</option>
			</select>
		</div>
		<!-- 이메일 email1 + email2 -->
		<div class="groupForm" onchange="plusEmail()">
			<label for="emailId">이메일</label> <input type="text" class="inputForm"
				id="emailId" name="emailId" style="width: 100px;" required>
			<span id="at">@</span> <input id="textEmail" required> <select
				id="select">
				<option value="" disabled selected>E-Mail 선택</option>
				<option value="gmail.com" id="gmail.com">gmail.com</option>
				<option value="naver.com" id="naver.com">naver.com</option>
				<option value="yahoo.co.kr" id="yahoo.co.kr">yahoo.co.kr</option>
				<option value="hanmail.net" id="hanmail.net">hanmail.net</option>
				<option value="directly" id="textEmail">--직접 입력--</option>
			</select>
			<!-- 인증번호 구현 다시 하기 -->
			<!--    <button class="btn" th:onclick="|location.href= '@{/}'">인증번호
            받기</button><br>
         <input type="text" id="authNum" name="authNum"
            placeholder="인증번호를 입력하세요" class="inputForm" disabled maxlength="4">
         <div class="validFeedback" id="checkAuthNum"
            style="display: none; color: red;">인증받은 후 인증번호를 입력하세요</div> -->
		</div>
		<!-- 사용 목적 -->
		<div class="groupForm">
			<label for="purposename">사용 목적</label>
			<div th:each="purposeList : ${purposeList}">
				<input type="radio" class="inputForm"
					th:value="${purposeList.purposename}"
					th:id="${purposeList.purposename}" name="purposename">[[${purposeList.purposename}]]
			</div>
		</div>
		<!-- 버튼 누를 시, checkInfo 페이지로 이동 -->
		<input type="submit" value="입력확인화면으로"><input type="hidden" id="email" name="email">
	</form>
</body>
</html>
