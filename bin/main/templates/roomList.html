<script th:src="@{/js/jquery-3.6.0.js}"></script>
<script th:inline="javascript">
	let purposeType = 'all';

	$(document)
			.ready(
					function() {

						let maxuser = $('#createRoomMaxUser').val();
						let purposeTypeCount = 0;

						searchRoom();

						$("#setPwd").change(
								function() {
									if (this.checked) {
										$('#createRoomPassword').attr(
												"readonly", false);
									} else if (!this.checked) {
										$('#createRoomPassword').attr(
												"readonly", true);
									}
								});
						$(".createRoom-btn").on('click', function() {
							$('#createRoomMaxUser').val(maxuser);
							$("#popup").css('display', 'flex').hide().fadeIn();
						});
						$("#confirm")
								.on(
										'click',
										function() {
											if ($('#createRoomName').val() == '') {
												alert('채팅방의 제목을 입력해주세요.');
												return false;
											} else if ($('#setPwd').is(
													':checked')
													&& $('#createRoomPassword')
															.val() == '') {
												alert('비밀번호 설정을 체크하셨습니다. 비밀번호를 입력해주세요.');
												return false;
											} else if (!$('#setPwd').is(
													':checked')
													&& $('#createRoomPassword')
															.val() != '') {
												alert('비밀번호 설정을 체크하지 않았습니다.');
												return false;
											} else if ($('#createRoomMaxUser')
													.val() == '') {
												alert('채팅방의 최대 인원수를 입력해주세요.');
												return false;
											} else if (!$('.roomType').is(
													':checked')) {
												alert('채팅방의 카테고리를 설정해주세요.');
												return false;
											} else {
												$
														.ajax({
															url : 'createRoom',
															type : 'post',
															data : {
																roomname : $(
																		'#createRoomName')
																		.val(),
																roompw : $(
																		'#createRoomPassword')
																		.val(),
																maxuser : $(
																		'#createRoomMaxUser')
																		.val(),
																purposename : $(
																		"input[name='roomType']:checked")
																		.val()
															},
															success : function(
																	insertedRoom) {
																alert('채팅방이 개설되었습니다.');
																$(
																		'#createRoomName')
																		.val('');
																$(
																		'#createRoomPassword')
																		.val('');
																$(
																		'#createRoomMaxUser')
																		.val('');
																$('#setPwd')
																		.prop(
																				'checked',
																				false);
																$('.roomType')
																		.prop(
																				'checked',
																				false);
																modalClose();
																location.href = "/chat/chat?roomid="
																		+ insertedRoom.roomid;
															},
															error : function() {
																alert('채팅방 개설에 실패했습니다.');
															}
														})
											}
										});
						$('#close').on('click', function() {
							$('#createRoomName').val('');
							$('#createRoomPassword').val('');
							$('#createRoomMaxUser').val('');
							$('#setPwd').prop('checked', false);
							$('.roomType').prop('checked', false);
							maxuser = 1;
							modalClose();
						});
						$("#roomList").on('click', function() {
							if ($('#wordType').val() != "all") {
								searchRoom();
							}
						});
						$("#sortType").on("change", function() {
							searchRoom();
						});
						$('.purposeType')
								.on(
										'click',
										function() {
											purposeType = $(this).val();
											if (purposeTypeCount == 0) {
												$(this).css({
													
															'background-color': '#ffffff',
															'border': '1px solid #000',
															'color': '#000'
												});
												purposeTypeCount = 1;
												searchRoom();
											} else if (purposeTypeCount == 1) {
												$(this)
														.css({
															'background-color' : '#ff385c',
															'color' : '#fff',
															'border': '1px solid #eeeeee'
															
															});
												purposeType = '';
												searchRoomAllPurposeType();
												purposeTypeCount = 0;
											}
										})
						$('#userminus').on('click', function() {
							if (maxuser > 1) {
								maxuser = parseInt(maxuser) - 1;
							}
							$('#createRoomMaxUser').val(maxuser);
						})
						$('#userplus').on('click', function() {
							maxuser = parseInt(maxuser) + 1;
							$('#createRoomMaxUser').val(maxuser);
						})
						$('#createRoomMaxUser').on('change', function() {
							maxuser = $('#createRoomMaxUser').val();
						})
					});
	function searchRoom(page) {
		$.ajax({
			url : 'searchRoom',
			type : 'post',
			data : {
				page : page,
				sortType : $('#sortType').val(),
				purposeType : purposeType,
				wordType : $('#wordType').val(),
				searchWord : $('#searchWord').val()
			},
			dataType : 'JSON',
			success : function(map) {
				output(map.roomList);
				pagingForm(map.navi);
			},
			error : function() {
			}
		});
	}
	function searchRoomAllPurposeType(page) {
		$.ajax({
			url : 'searchRoom',
			type : 'post',
			data : {
				page : page,
				sortType : $('#sortType').val(),
				purposeType : 'all',
				wordType : $('#wordType').val(),
				searchWord : $('#searchWord').val()
			},
			dataType : 'JSON',
			success : function(map) {
				output(map.roomList);
				pagingForm(map.navi);
			},
			error : function() {
			}
		});
	}
	function output(roomList) {
		let s = '';
		$(roomList)
				.each(
						function(i, n) {
							s += '<div class="col-lg-4 col-md-6 d-flex align-items-stretch">';
							s += '<div class="icon-box" id="' + n.roomid
									+ '" onclick="intoChat(' + n.roomid + ')">';
							s += '<div class="icon"><img class="icon-logo" src="../images/playVideo.svg"><i class="bx bxl-dribbble"></i></div>';
							s += '<h4><a href="" style="text-decoration: none;">' + n.roomname + '</a></h4>';
							s += '<div class="room-title">';
							s += '<table>';
							s += '<tr><td colspan="2">' + n.hostid
									+ '님의 채팅방입니다</td></tr>';
							s += '<tr><td>' + n.membercount + ' / ' + n.maxuser
									+ '</td></tr>';
							s += '</table></div></div></div>';
						});
		$('.room-title').css({
			'flex' : '1',
			'margin' : '1rem 0',
			'position' : 'relative',
			'display' : 'flex',
			'align-items' : 'center',
			'justify-content' : 'center',
			'font-weight' : 'bold'
		});
		$('.row').html(s);
	}
	function pagingForm(navi) {
		let s = '<ul class="pageNum">';
		s += '<li><a href="javascript:pagingFormSubmit(' + (navi.currentPage - 1)
				+ ')">◀</a></li> ';
		for (let i = navi.startPageGroup; i <= navi.endPageGroup; i++) {
			s += '<li class="pageNumber"><a href="javascript:pagingFormSubmit(' + i + ')">' + i
					+ '</a>&nbsp;</li>';
		}
		s += '<li><a href="javascript:pagingFormSubmit(' + (navi.currentPage + 1)
				+ ')">▶</a></li> ';
		s += '</ul>'
		document.getElementById('pagingForm').innerHTML = s;
	}
	function pagingFormSubmit(currentPage) {
		let page = document.getElementById('page');
		page.value = currentPage;
		searchRoom(page.value);
	}
	function modalClose() {
		$("#popup").fadeOut();
	}
	function intoChat(roomid) {
		location.href = "/chat/chat?roomid=" + roomid;
	}
</script>
</head>

</div>
